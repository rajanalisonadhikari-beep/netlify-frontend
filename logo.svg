<svg xmlns="http://www.w3.org/2000/svg" width="260" height="80" viewBox="0 0 260 80" role="img" aria-label="Rajan Adhikari logo">
  <defs>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise" />
      <feComposite in="noise" in2="SourceGraphic" operator="in" result="rough" />
      <feGaussianBlur in="rough" stdDeviation="0.3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="in" />
    </filter>
  </defs>
  <rect width="260" height="80" fill="transparent" />
  <text x="12" y="56" font-family="Impact, Arial Black, sans-serif" font-size="36" font-weight="900" letter-spacing="-1" fill="#0b3d91" filter="url(#rough)">RAJAN ADHIKARI</text>
</svg>
