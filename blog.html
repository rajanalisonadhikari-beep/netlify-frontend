<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Read Rajan Adhikari's latest blog posts about SEO, trekking, and storytelling." />
    <meta property="og:title" content="Rajan Adhikari | Blog" />
    <meta property="og:description" content="Fresh posts and stories from Rajan's SEO and trekking work." />
    <title>Rajan Adhikari | Blog</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container" aria-label="Blog navigation">
        <a class="brand" href="index.html"><img class="site-logo" src="logo.svg" alt="Rajan logo" data-cms="logo" /></a>
        <div class="nav-links">
          <a href="index.html#home">Home</a>
          <a href="about.html" target="_blank" rel="noopener">About</a>
          <a href="trekking.html" target="_blank" rel="noopener">Trekking</a>
          <a href="barber.html" target="_blank" rel="noopener">Barber</a>
        </div>
      </nav>
    </header>

    <main class="section section-alt">
      <div class="container">
        <p class="eyebrow" data-cms="eyebrow">Blog</p>
        <h1 data-cms="heading">Latest Posts</h1>
        <div id="blog-posts" class="blog-grid" aria-live="polite"></div>

        <div class="blog-form-card" style="margin-top: 1.6rem;">
          <h3>Write a New Post</h3>
          <form id="blog-form" class="stacked-form">
            <label>
              Title
              <input type="text" name="title" required />
            </label>
            <label>
              Category
              <input type="text" name="category" required />
            </label>
            <label>
              Content
              <textarea name="content" rows="5" required></textarea>
            </label>
            <button class="btn btn-primary" type="submit">Publish Post</button>
          </form>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-row">
        <p>© 2026 Rajan Adhikari. Stories from SEO, trekking, and more.</p>
        <a href="index.html">Back to Home</a>
      </div>
    </footer>
    <script src="script.js"></script>
    <script src="cms-loader.js" data-cms-page="blog"></script>
  </body>
</html>
